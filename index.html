<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MCRM Client Journey Assessment</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">METROPOLITAN ACADEMY</p>
        <h1>MCRM Client Journey Assessment</h1>
      </div>
      <div class="header-actions">
        <button id="caseButton" class="secondary" type="button">Case file</button>
        <button id="fullscreenButton" class="secondary" type="button">Fullscreen</button>
      </div>
    </header>

    <section class="coach" aria-labelledby="stepTitle">
      <div class="coach-count">
        <span id="stepLabel">Assessment briefing</span>
        <strong id="clock">12 October 2026 · 9:00 AM</strong>
      </div>
      <div class="coach-copy">
        <h2 id="stepTitle">Manage the complete client journey</h2>
        <p id="instruction">Review the case file and complete each required action in MCRM.</p>
        <p id="feedback" aria-live="polite"></p>
      </div>
      <button id="hintButton" class="hint" type="button">Show hint</button>
    </section>

    <div class="progress-track" aria-hidden="true"><span id="progressFill"></span></div>

    <section class="workspace" id="workspace" aria-label="MCRM simulation workspace">
      <div class="canvas" id="canvas">
        <img id="screen" alt="MCRM interface screenshot">
        <div id="interactionLayer" class="interaction-layer"></div>
      </div>
    </section>

    <footer class="footerbar">
      <span id="progressText">Ready to begin</span>
      <button id="restartButton" class="text-button" type="button">Restart assessment</button>
    </footer>
  </main>

  <div id="caseDrawer" class="drawer" hidden>
    <button class="drawer-scrim" id="drawerScrim" aria-label="Close case file"></button>
    <aside class="case-panel" role="dialog" aria-modal="true" aria-labelledby="caseTitle">
      <button id="closeCase" class="close" type="button" aria-label="Close case file">×</button>
      <p class="eyebrow">LIVE CASE FILE</p>
      <h2 id="caseTitle">Omar and Saira</h2>
      <div id="caseContent"></div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
